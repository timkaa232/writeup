<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WriteUp — Вход</title>
    <link rel="stylesheet" href="style-main.css?v=99">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>W</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="page-login" class="auth-page">
    <div class="auth-container">
        <div class="auth-left">
            <h2>С возвращением!</h2>
            <p>Продолжайте прокачивать письменный английский.</p>
        </div>
        <div class="auth-right">
            <h2>Вход</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="••••••" required>
                </div>
                <p id="login-error" class="error-message"></p>
                <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
            </form>
            <p style="text-align:center;margin-top:16px;">
                Нет аккаунта? <a href="register.html">Регистрация</a>
            </p>
            <p style="text-align:center;margin-top:8px;">
                <a href="index.html">На главную</a>
            </p>
        </div>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
